<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <h1>Job Application Tracker</h1>

      <div>
        <a href="index.html">Dashboard</a>
        <a href="add.html">Add Application</a>
        <a href="applications.html">Applications</a>
      </div>
    </nav>

    <main>
      <section class="cards">
        <div class="card">
          <h3>Total</h3>
          <h1 id="totalApplications">0</h1>
        </div>

        <div class="card">
          <h3>Applied</h3>
          <h1 id="applied">0</h1>
        </div>

        <div class="card">
          <h3>Interview</h3>
          <h1 id="interview">0</h1>
        </div>

        <div class="card">
          <h3>Selected</h3>
          <h1 id="selected">0</h1>
        </div>

        <div class="card">
          <h3>Rejected</h3>
          <h1 id="rejected">0</h1>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
